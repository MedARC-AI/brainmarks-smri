[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "brainmarks-smri"
version = "0.1.0"
description = "Benchmark for structural brain MRI foundation models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dcm2niix==1.0.20260724",
    "einops",
    "huggingface-hub",
    "isal",
    "nibabel",
    "numpy",
    "omegaconf",
    "openpyxl",
    "pandas",
    "pillow",
    "platformdirs",
    "pyarrow",
    "pydicom",
    "pyreadr",
    "requests",
    "scikit-learn",
    "scipy",
    "tabulate",
    "torch",
    "xlrd",
]

[project.optional-dependencies]
brainiac = ["einops", "monai"]
neurojepa = [
    "cupy-cuda13x[ctk]",
    "monai",
    "neurojepa @ git+https://github.com/clane9/Neuro-JEPA.git@e9dff69446f643b6cab8213c15a44523301e51da",
]
neurovfm = [
    "SimpleITK",
    "neurovfm @ git+https://github.com/clane9/neurovfm.git@e7563dc34f43027d973a4958a94a68d45e985c9d",
]
walnut = [
    "walnut-fomo26 @ https://github.com/MedARC-AI/walnut-fomo26/archive/173de005bf055390056aa609a3c58401ed0bdc11.tar.gz",
]
amaes = ["dynamic-network-architectures==0.4.4"]
openmind_simclr = ["dynamic-network-architectures==0.4.4"]
nnfoundation_vit = ["dynamic-network-architectures==0.4.4", "timm"]
voco = ["monai>=1.5"]  # VoCo needs the `downsample` class argument of SwinTransformer
braindino = [
    "dinov3 @ git+https://github.com/facebookresearch/dinov3.git@6876159a11b4df116f30f667f8c9888617df0751",
    "gdown",
]
preprocess = [
    "antspyx>=0.6.3",  # 0.6.1 ignores the random seed
    # SynthStrip: 0.6.3 breaks with numpy>=2.3 (np.bool passed as an int); fixed on master, unreleased
    "surfa @ git+https://github.com/freesurfer/surfa.git@0a3ee465817a83d3da20d9e09d22b022dee5290e",
]

[dependency-groups]
dev = [
    "flask",
    "matplotlib",
    "pre-commit",
    "pytest",
]

[tool.uv]
python-preference = "only-managed"
# dynamic-network-architectures pins timm<1.0.23 for a 3D RoPE bug; nnfoundation_vit works around it
override-dependencies = ["timm"]

[tool.ruff]
line-length = 100
