[project]
name = "brainmarks-smri"
version = "0.1.0"
description = "Benchmark for structural brain MRI foundation models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8",
    "huggingface-hub>=0.30",
    "nibabel>=5",
    "numpy>=2",
    "omegaconf>=2.3",
    "openpyxl>=3.1",
    "pandas>=3",
    "platformdirs>=4",
    "requests>=2.28",
    "scikit-learn>=1.6",
    "scipy>=1.11",
    "tabulate>=0.10.0",
    "torch>=2.5",
    "xlrd>=2",
]

[project.optional-dependencies]
brainiac = ["einops>=0.8", "monai>=1.4"]
neurojepa = [
    "cupy-cuda13x[ctk]>=14",
    "monai>=1.4",
    "neurojepa @ git+https://github.com/clane9/Neuro-JEPA.git@e9dff69446f643b6cab8213c15a44523301e51da",
]
neurovfm = [
    "SimpleITK>=2.4",
    "neurovfm @ git+https://github.com/clane9/neurovfm.git@ed3af2dfa1d54433f33432ebd677db6ba10a9e96",
]
walnut = [
    "walnut-fomo26 @ https://github.com/MedARC-AI/walnut-fomo26/archive/173de005bf055390056aa609a3c58401ed0bdc11.tar.gz",
]
braindino = [
    "dinov3 @ git+https://github.com/facebookresearch/dinov3.git@6876159a11b4df116f30f667f8c9888617df0751",
    "gdown>=6.4.1",
]
preprocess = [
    "antspyx>=0.6.3",  # 0.6.1 ignores the random seed
    # SynthStrip: 0.6.3 breaks with numpy>=2.3 (np.bool passed as an int); fixed on master, unreleased
    "surfa @ git+https://github.com/freesurfer/surfa.git@0a3ee465817a83d3da20d9e09d22b022dee5290e",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
