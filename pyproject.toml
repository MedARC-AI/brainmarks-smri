[project]
name = "brain-datasets"
version = "0.1.0"
description = "Structural MRI benchmark datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nibabel>=5.4.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
