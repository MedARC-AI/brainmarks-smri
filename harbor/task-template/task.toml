schema_version = "1.3"
artifacts = ["/output"]

[task]
name = "brainmarks-smri/{name}"
description = "{description}"
keywords = ["brain-mri", "brainmarks-smri"]

[agent]
timeout_sec = 3600.0
user = "agent"
# Harbor still allows the agent's model API host.
network_mode = "no-network"

[verifier]
timeout_sec = 600.0

[verifier.environment]
network_mode = "no-network"
cpus = 1
memory_mb = 4096

[environment]
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
